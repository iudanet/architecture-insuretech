events {}

http {
    resolver 10.96.0.10 valid=10s ipv6=off;

    map $http_x_api_key $partner_key {
        default        "";
        "pk-partner-a" partner-a;
        "pk-partner-b" partner-b;
    }

    limit_req_zone $partner_key        zone=partner_api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=web_users:10m   rate=10r/s;
    limit_conn_zone $partner_key       zone=partner_conn:10m;

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    server {
        listen 80;
        server_name api.insuretech.ru;

        set $core_app http://core-app.insuretech.svc.cluster.local:8080;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;

        location /api/partners/ {
            if ($partner_key = "") {
                return 401;
            }
            limit_req  zone=partner_api burst=10 nodelay;
            limit_conn partner_conn 50;
            proxy_pass $core_app;
        }

        location / {
            limit_req zone=web_users burst=20 nodelay;
            proxy_pass $core_app;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
}
